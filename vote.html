<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vote for Mandals</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff8e1;
      color: #333;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #dd4315;
      margin-bottom: 30px;
    }

    .mandal {
      background-color: #fff;
      border: 2px solid #dd4315;
      border-radius: 10px;
      padding: 15px;
      margin: 15px auto;
      width: 80%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .mandal h3 {
      margin-bottom: 10px;
    }

    .mandal button {
      background-color: #dd4315;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    .mandal button:hover {
      background-color: #c32f0e;
    }

    .vote-count {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🗳️ Vote for Your Favorite Ganpati Mandal</h1>
  <div id="mandal-list"></div>

  <script src="vote.js"></script>
</body>
</html>
