<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Mandal</title>
  <link rel="stylesheet" href="style.css">
  <script>
    function validateForm(event) {
      event.preventDefault();

      const mandalName = document.getElementById("mandalName").value.trim();
      const location = document.getElementById("location").value.trim();
      const Person = document.getElementById("person").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const about = document.getElementById("about").value.trim();

      // Simple validations
      if (!mandalName || !location || !Person || !phone || !about) {
        alert("All fields are required!");
        return false;
      }

      // Phone number validation (only digits, 10 numbers)
      const phonePattern = /^[0-9]{10}$/;
      if (!phonePattern.test(phone)) {
        alert("Please enter a valid 10-digit phone number.");
        return false;
      }

      // Name validation (only letters and spaces)
      const namePattern = /^[A-Za-z\s]+$/;
      if (!namePattern.test(contact)) {
        alert("Contact name should only contain letters.");
        return false;
      }

      alert("Registration successful!");
      document.getElementById("mandal-form").reset();
    }
  </script>
</head>
<body>
  <h1>Bhakti-United</h1>
  <h2>Register Your Mandal</h2>

  <form id="mandal-form" onsubmit="validateForm(event)">
    <label>Mandal Name:</label>
    <input type="text" id="mandalName"><br><br>

    <label>Location:</label>
    <input type="text" id="location"><br><br>

    <label>Person Name:</label>
    <input type="text" id="contact"><br><br>

    <label>Phone Number:</label>
    <input type="text" id="phone"><br><br>

    <label>About Mandal:</label>
    <textarea id="about"></textarea><br><br>

    <button type="submit">Register</button>
  </form>
</body>
</html>
