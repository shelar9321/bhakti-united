<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Your Mandal - Bhakti-United</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f8f8;
      margin: 0;
      padding: 0;
    }

    .header {
      background-color: #FFD700;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #4B0082;
    }

    .form-container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #4B0082;
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      display: block;
      margin: 10px 0 5px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #4B0082;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #360060;
    }
  </style>
</head>
<body>

  <div class="header">🙏 Bhakti-United</div>

  <div class="form-container">
    <h2>Register Your Mandal</h2>
    <form id="mandalForm">
      <label for="mandalName">Mandal Name</label>
      <input type="text" id="mandalName" maxlength="50" placeholder="Enter mandal name">

      <label for="headName">Head of Mandal</label>
      <input type="text" id="headName" maxlength="50" placeholder="Enter head of mandal">

      <label for="location">Location</label>
      <input type="text" id="location" maxlength="50" placeholder="Enter location">

      <label for="contact">Contact Number</label>
      <input type="text" id="contact" maxlength="10" placeholder="Enter contact number">

      <label for="about">About Mandal</label>
      <textarea id="about" maxlength="200" placeholder="Enter details"></textarea>

      <button type="submit">Register</button>
    </form>
  </div>

  <script>
    document.getElementById('mandalForm').addEventListener('submit', function(event) {
      event.preventDefault();

      const mandalName = document.getElementById('mandalName').value.trim();
      const headName = document.getElementById('headName').value.trim();
      const location = document.getElementById('location').value.trim();
      const contact = document.getElementById('contact').value.trim();
      const about = document.getElementById('about').value.trim();

      if (!mandalName || !headName || !location || !contact || !about) {
        alert('All fields are required!');
        return;
      }

      if (!/^\d{10}$/.test(contact)) {
        alert('Please enter a valid 10-digit contact number.');
        return;
      }

      alert('Mandal Registered Successfully!');
      this.reset();
    });
  </script>

</body>
</html>
