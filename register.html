<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Your Mandal - Bhakti-United</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
    }

    header {
      background-color: #ffd700;
      text-align: center;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      color: #4a0072;
    }

    .container {
      max-width: 450px;
      margin: 40px auto;
      background: #fff;
      padding: 30px 25px;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
    }

    h2 {
      text-align: center;
      color: #4a0072;
      margin-bottom: 25px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 6px;
      color: #333;
    }

    input,
    textarea {
      width: calc(100% - 10px);
      padding: 12px 14px;
      margin-bottom: 16px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
      transition: 0.3s;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #4a0072;
      box-shadow: 0px 0px 5px rgba(74, 0, 114, 0.3);
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #4a0072;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #360052;
    }
  </style>
</head>
<body>
  <header>
    <h1>🙏 Bhakti-United</h1>
  </header>

  <div class="container">
    <h2>Register Your Mandal</h2>
    <form id="mandalForm">
      <label for="mandalName">Mandal Name</label>
      <input type="text" id="mandalName" placeholder="Enter mandal name" required />

      <label for="headName">Head of Mandal</label>
      <input type="text" id="headName" placeholder="Enter head of mandal name" required />

      <label for="location">Location</label>
      <input type="text" id="location" placeholder="Enter location" required />

      <label for="contact">Contact Number</label>
      <input type="tel" id="contact" placeholder="Enter contact number" required />

      <label for="about">About Mandal</label>
      <textarea id="about" rows="4" placeholder="Enter details" required></textarea>

      <button type="submit">Register</button>
    </form>
  </div>

  <script>
    document.getElementById('mandalForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const mandalName = document.getElementById('mandalName').value.trim();
      const headName = document.getElementById('headName').value.trim();
      const location = document.getElementById('location').value.trim();
      const contact = document.getElementById('contact').value.trim();
      const about = document.getElementById('about').value.trim();

      if (!mandalName || !headName || !location || !contact || !about) {
        alert('Please fill out all fields before submitting.');
        return;
      }

      alert('Registration Successful for ' + mandalName + '!');
      this.reset();
    });
  </script>
</body>
</html>
