<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Your Mandal - Bhakti-United</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #ffd700;
      padding: 20px;
      text-align: center;
      color: #4b0082;
      font-size: 26px;
      font-weight: bold;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
    }

    .container {
      max-width: 450px;
      margin: 40px auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
    }

    h2 {
      text-align: center;
      color: #4b0082;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-weight: 600;
      color: #333;
    }

    input, textarea {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 15px;
      transition: 0.3s;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: #4b0082;
      box-shadow: 0 0 6px rgba(75, 0, 130, 0.3);
    }

    textarea {
      min-height: 90px;
      resize: none;
    }

    button {
      background-color: #4b0082;
      color: white;
      padding: 12px;
      border: none;
      width: 100%;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 6px;
      transition: 0.3s;
    }

    button:hover {
      background-color: #360060;
    }
  </style>
</head>
<body>

  <header>🙏 Bhakti-United</header>

  <div class="container">
    <h2>Register Your Mandal</h2>
    <form id="mandal-form" onsubmit="return validateForm(event)">
      <label for="mandalName">Mandal Name</label>
      <input type="text" id="mandalName" placeholder="Enter mandal name" />

      <label for="headName">Head of Mandal</label>
      <input type="text" id="headName" placeholder="Enter head of mandal name" />

      <label for="location">Location</label>
      <input type="text" id="location" placeholder="Enter location" />

      <label for="contact">Contact Number</label>
      <input type="text" id="contact" placeholder="Enter contact number" />

      <label for="about">About Mandal</label>
      <textarea id="about" placeholder="Enter details"></textarea>

      <button type="submit">Register</button>
    </form>
  </div>

  <script>
    function validateForm(event) {
      event.preventDefault();

      const name = document.getElementById("mandalName").value.trim();
      const head = document.getElementById("headName").value.trim();
      const location = document.getElementById("location").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const about = document.getElementById("about").value.trim();

      if (!name || !head || !location || !contact || !about) {
        alert("All fields are required.");
        return false;
      }

      const phonePattern = /^[6-9]\d{9}$/;
      if (!phonePattern.test(contact)) {
        alert("Please enter a valid 10-digit phone number starting with 6-9.");
        return false;
      }

      alert("Mandal registered successfully!");
      document.getElementById("mandal-form").reset();
      return true;
    }
  </script>

</body>
</html>
