<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Mandal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      border-radius: 8px;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.2);
    }
    input, textarea, button {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
    }
    button {
      background: #ff9800;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #e68900;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Register Your Mandal</h2>
    <form id="mandal-form" onsubmit="return validateForm(event)">
      <label>Mandal Name</label>
      <input type="text" id="mandalName" placeholder="Enter mandal name" required />

      <label>Location</label>
      <input type="text" id="location" placeholder="Enter location" required />

      <label>Contact Number</label>
      <input type="text" id="contact" placeholder="Enter contact number" required />

      <label>Description</label>
      <textarea id="description" placeholder="Enter details" required></textarea>

      <button type="submit">Register</button>
    </form>
  </div>

  <script>
    function validateForm(event) {
      event.preventDefault(); // Stop form submission

      const name = document.getElementById("mandalName").value.trim();
      const location = document.getElementById("location").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const description = document.getElementById("description").value.trim();

      if (name === "" || location === "" || contact === "" || description === "") {
        alert("All fields are required.");
        return false;
      }

      const phonePattern = /^[6-9]\d{9}$/;
      if (!phonePattern.test(contact)) {
        alert("Please enter a valid 10-digit phone number starting with 6-9.");
        return false;
      }

      alert("Mandal registered successfully!");
      document.getElementById("mandal-form").reset();
      return true;
    }
  </script>
</body>
</html>
