<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Mandal</title>
  <link rel="stylesheet" href="style.css">

  <script>
    function validateForm(event) {
      event.preventDefault(); // stop form from submitting

      const mandalName = document.getElementById("mandalName").value.trim();
      const location = document.getElementById("location").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const about = document.getElementById("about").value.trim();

      // Check if all fields are filled
      if (!mandalName || !location || !contact || !phone || !about) {
        alert("Please fill out all fields before registering!");
        return false;
      }

      // Phone number validation
      const phonePattern = /^[0-9]{10}$/;
      if (!phonePattern.test(phone)) {
        alert("Enter a valid 10-digit phone number.");
        return false;
      }

      // Contact name validation
      const namePattern = /^[A-Za-z\s]+$/;
      if (!namePattern.test(contact)) {
        alert("Contact name should contain only letters.");
        return false;
      }

      // If all checks pass
      alert("Registration Successful!");
      document.getElementById("mandal-form").reset();
      return true;
    }
  </script>
</head>
<body>
  <h1>Bhakti-United</h1>
  <h2>Register Your Mandal</h2>

  <form id="mandal-form" onsubmit="return validateForm(event)">
    <label>Mandal Name:</label>
    <input type="text" id="mandalName"><br><br>

    <label>Location:</label>
    <input type="text" id="location"><br><br>

    <label>Contact Person:</label>
    <input type="text" id="contact"><br><br>

    <label>Phone Number:</label>
    <input type="text" id="phone"><br><br>

    <label>About Mandal:</label>
    <textarea id="about"></textarea><br><br>

    <button type="submit">Register</button>
  </form>
</body>
</html>
