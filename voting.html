<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote for Your Favorite Mandal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Vote for Your Favorite Ganpati Mandal</h1>

    <div id="mandal-list">
        <div class="mandal">
            <h3>Shree Siddhivinayak Mandal</h3>
            <button onclick="vote('Shree Siddhivinayak Mandal')">Vote</button>
            <p>Votes: <span id="votes-Shree Siddhivinayak Mandal">0</span></p>

            <label>Update Waiting Time (mins):</label>
            <input type="number" id="wait-Shree Siddhivinayak Mandal" min="0">
            <button onclick="updateWaitTime('Shree Siddhivinayak Mandal')">Update</button>
            <p>Waiting Time: <span id="waiting-Shree Siddhivinayak Mandal">0</span> mins</p>
        </div>

        <div class="mandal">
            <h3>Lalbaugcha Raja</h3>
            <button onclick="vote('Lalbaugcha Raja')">Vote</button>
            <p>Votes: <span id="votes-Lalbaugcha Raja">0</span></p>

            <label>Update Waiting Time (mins):</label>
            <input type="number" id="wait-Lalbaugcha Raja" min="0">
            <button onclick="updateWaitTime('Lalbaugcha Raja')">Update</button>
            <p>Waiting Time: <span id="waiting-Lalbaugcha Raja">0</span> mins</p>
        </div>
    </div>

    <script src="voting.js"></script>
</body>
</html>
